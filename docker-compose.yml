# ──────────────────────────────────────────────────────
# TenantScale API — Docker Compose
# ──────────────────────────────────────────────────────
#
# PROFILES:
#   (default)  Production API only
#              cp .env.example .env  →  fill in SUPABASE_* vars  →  docker compose up -d
#   --profile dev     API with hot-reload (tsx watch) + supporting db
#   --profile full    API + local PostgreSQL (full self-host)
#
# For production: set a strong CRON_SECRET, restrict CORS_ORIGIN,
# and configure Stripe / Sentry as needed.

name: tenantscale

services:
  # ── API Server (production) ────────────────────────
  api:
    image: tenantscale/api:latest
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "4000:3001"
    environment:
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL is required}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      - PORT=3001
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - DEPLOYMENT_MODE=self_hosted
      # Optional
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      - CRON_SECRET=${CRON_SECRET:-}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Dev API (hot-reloads on source changes — --profile dev) ──
  # Mirrors local `pnpm dev` inside Docker. The source tree is
  # bind-mounted so tsx watch restarts on every edit.
  api-dev:
    profiles:
      - dev
    image: tenantscale/api:dev
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: dev
    ports:
      - "3001:3001"
    environment:
      - SUPABASE_URL=${SUPABASE_URL:?SUPABASE_URL is required}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      - PORT=3001
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      # Optional
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - ./packages/api/src:/app/packages/api/src
      - ./packages/api/supabase:/app/packages/api/supabase
      # .env (if present) is loaded by tsx watch via dotenv
      - ./.env:/app/.env:ro
    depends_on:
      - db
    restart: unless-stopped

  # ── PostgreSQL (optional — enable with --profile full or debug) ──
  # A bare Postgres instance WITHOUT Supabase Auth. To use it, you also
  # need GoTrue (Supabase Auth) or a custom auth solution.
  # See docs/self-hosting.md for instructions.
  db:
    profiles:
      - full
      - dev
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tenantscale
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: tenantscale
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/api/supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantscale"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata: