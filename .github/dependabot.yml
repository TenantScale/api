version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
    ignore:
      # next >=16.3.0's hasNecessaryDependencies requires typescript/bin/tsc on
      # disk, but the portal aliases npm:@typescript/typescript6 which only ships
      # bin/tsc6. Remove this ignore once upstream supports the TS6 alias.
      - dependency-name: "next"
        versions:
          - ">=16.3.0"
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
